<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Stock Control Extension
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    />

</head>

<body>

    <div class="container">

        <div class="header">

            <h2>
                Stock Control Extension
            </h2>

            <div id="status">
                Waiting for Manager.io...
            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="card">

            <label>
                Customer
            </label>

            <select id="customerSelect">

                <option value="">
                    Loading customers...
                </option>

            </select>

        </div>


        <!-- ITEM -->

        <div class="card">

            <label>
                Inventory Item
            </label>

            <select id="itemSelect">

                <option value="">
                    Loading inventory items...
                </option>

            </select>

        </div>


        <!-- STOCK -->

        <div class="card">

            <div id="stockDisplay">

                Select item to view stock

            </div>

        </div>


        <!-- PRICE -->

        <div class="card">

            <label>
                Default Sales Price
            </label>

            <input
                type="text"
                id="salesPrice"
                readonly
            />

        </div>


        <!-- QUANTITY -->

        <div class="card">

            <label>
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                min="1"
                value="1"
            />

        </div>


        <!-- VALIDATION -->

        <div class="card">

            <button id="validateButton">

                Validate Invoice

            </button>

        </div>


        <!-- MESSAGE -->

        <div class="card">

            <div id="message">

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
